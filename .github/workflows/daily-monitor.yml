name: INDETAIL Public Demand Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *" # 09:00 Asia/Kolkata

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect public RSS results
        run: python monitor.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leads.csv data/leads.json
          git diff --cached --quiet || git commit -m "Update public demand report"
          git push

  deploy-dashboard:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest repository data
        uses: actions/checkout@v4
      - name: Prepare dashboard artifact
        run: |
          mkdir -p docs/data
          cp data/leads.json docs/data/leads.json
          cp data/leads.csv docs/data/leads.csv
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
