name: INDETAIL Public Demand Monitor

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *" # 09:00 Asia/Kolkata

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect public RSS results
        run: python monitor.py
      - name: Prepare dashboard data
        run: |
          mkdir -p docs/data
          cp data/leads.json docs/data/leads.json
          cp data/leads.csv docs/data/leads.csv
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
